name: Build GBFrame

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.14.3 }
      - name: Build
        run: |
          set +e
          gradle --no-daemon :gbframe:assembleRelease > build.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "^e: " build.log; grep -E "What went wrong" -A4 build.log) | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          tail -30 build.log; exit $rc
